name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: |
          npm ci || npm install

      - name: Build Web Assets (Vite)
        run: |
          npm run build

      - name: Setup Capacitor Android
        run: |
          # Install Capacitor CLI & Android platform
          npm install --no-save @capacitor/core @capacitor/cli @capacitor/android
          
          # Initialize Capacitor if not already initialized
          npx cap init "MarQ AC Remote" "com.marq.acremote" --web-dir dist
          
          # Add android platform
          npx cap add android
          
          # Sync web build to android project
          npx cap sync android

      - name: Build Android Debug APK with Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarQ-AC-Remote-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
