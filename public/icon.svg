<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="remoteBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="lcdGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#99f6e4" />
      <stop offset="100%" stop-color="#5eead4" />
    </linearGradient>
    <linearGradient id="irBeam" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- IR Radiating waves -->
  <path d="M 226 70 Q 256 50 286 70" stroke="#38bdf8" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.6" />
  <path d="M 206 50 Q 256 25 306 50" stroke="#0ea5e9" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.4" />
  <circle cx="256" cy="90" r="8" fill="#ef4444" opacity="0.9" />

  <!-- Remote Body -->
  <rect x="136" y="96" width="240" height="376" rx="36" fill="url(#remoteBody)" filter="url(#shadow)" stroke="#cbd5e1" stroke-width="2" />

  <!-- LCD Screen -->
  <rect x="156" y="118" width="200" height="120" rx="14" fill="#0f172a" />
  <rect x="160" y="122" width="192" height="112" rx="10" fill="url(#lcdGlow)" opacity="0.9" />
  
  <!-- LCD Text & Digits -->
  <text x="172" y="142" font-family="monospace" font-size="12" font-weight="bold" fill="#0f766e">COOL ❄</text>
  <text x="312" y="142" font-family="monospace" font-size="11" font-weight="bold" fill="#0f766e">FAN █▅▃</text>
  <text x="210" y="202" font-family="'Courier New', monospace" font-size="52" font-weight="900" fill="#134e4a">24</text>
  <text x="276" y="174" font-family="sans-serif" font-size="20" font-weight="bold" fill="#134e4a">°C</text>
  <text x="172" y="224" font-family="monospace" font-size="10" font-weight="bold" fill="#0f766e">SWING ↕</text>
  <text x="290" y="224" font-family="monospace" font-size="10" font-weight="bold" fill="#0f766e">ECO 🍃</text>

  <!-- Power Button -->
  <circle cx="256" cy="272" r="22" fill="#ef4444" stroke="#dc2626" stroke-width="2" />
  <path d="M 256 260 L 256 270 M 262 263 A 9 9 0 1 1 250 263" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" />

  <!-- Temp Up / Down rocker -->
  <rect x="166" y="310" width="70" height="36" rx="8" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="195" y="333" font-family="sans-serif" font-size="18" font-weight="bold" fill="#334155" text-anchor="middle">▲</text>
  <rect x="276" y="310" width="70" height="36" rx="8" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="311" y="333" font-family="sans-serif" font-size="18" font-weight="bold" fill="#334155" text-anchor="middle">▼</text>

  <!-- Mode / Fan Buttons -->
  <rect x="166" y="360" width="84" height="28" rx="7" fill="#3b82f6" />
  <text x="208" y="378" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">MODE</text>
  <rect x="262" y="360" width="84" height="28" rx="7" fill="#64748b" />
  <text x="304" y="378" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">FAN</text>

  <!-- Swing / Turbo Buttons -->
  <rect x="166" y="398" width="54" height="24" rx="6" fill="#cbd5e1" />
  <text x="193" y="414" font-family="sans-serif" font-size="9" font-weight="bold" fill="#334155" text-anchor="middle">SWING</text>
  <rect x="229" y="398" width="54" height="24" rx="6" fill="#f59e0b" />
  <text x="256" y="414" font-family="sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">TURBO</text>
  <rect x="292" y="398" width="54" height="24" rx="6" fill="#10b981" />
  <text x="319" y="414" font-family="sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">ECO</text>

  <!-- MarQ Branding -->
  <text x="256" y="450" font-family="sans-serif" font-size="12" font-weight="800" letter-spacing="2" fill="#64748b" text-anchor="middle">MARQ</text>
</svg>
